<div class="paginacion">
  <span class="info">{{ total }} resultados</span>

  <div class="controles">
    <button (click)="irAPagina(pagina - 1)" [disabled]="pagina === 1">← Anterior</button>
    <span class="numero-pagina">Página {{ pagina }} de {{ totalPaginas }}</span>
    <button (click)="irAPagina(pagina + 1)" [disabled]="pagina === totalPaginas">Siguiente →</button>
  </div>
</div>
