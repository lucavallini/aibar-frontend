<app-modal titulo="Cancelar viaje" (cerrado)="cerrar.emit()">
  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <label for="motivo">Motivo de la cancelaci&oacute;n</label>
  <textarea id="motivo" [(ngModel)]="motivoCancelacion" rows="3" (input)="motivoCancelacion = $any($event.target).value.toUpperCase()"></textarea>

  <div class="acciones-modal">
    <button (click)="cerrar.emit()">Volver</button>
    <button class="btn-primario" (click)="onConfirmar()" [disabled]="motivoCancelacion.trim().length < 5">Confirmar cancelaci&oacute;n</button>
  </div>
</app-modal>
