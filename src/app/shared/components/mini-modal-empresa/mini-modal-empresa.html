<app-modal titulo="Nueva empresa" tamano="chico" (cerrado)="cerrar()">
  <label for="empresaNombre">Nombre</label>
  <input id="empresaNombre" type="text" [(ngModel)]="nombreInput" placeholder="Nombre de la empresa" (input)="nombreInput = $event.target.value.toUpperCase()" />

  <div class="acciones-modal">
    <button (click)="cerrar()">Cancelar</button>
    <button class="btn-primario" (click)="confirmar()" [disabled]="!nombreInput.trim()">Agregar</button>
  </div>
</app-modal>
