<div class="contenedor">
  <app-pagina-header titulo="Multas" accionLabel="+ Nueva multa" [mostrarAccion]="!readonly()" (nuevo)="abrirModal()" />

  <app-estado-carga [cargando]="cargando()" [error]="error()" [mostrarError]="!modalAbierto()" />

  <app-tabla-paginada
    [headers]="['Patente', 'Chofer', 'Motivo', 'Monto', 'Fecha']"
    [items]="multas()"
    [cargando]="cargando()"
    [error]="error()"
    [pagina]="pagina()"
    [totalPaginas]="totalPaginas()"
    [total]="total()"
    emptyMessage="No hay multas registradas todavía."
    (cambioPagina)="cambiarPagina($event)"
  >
    @for (multa of multas(); track multa.id) {
      <tr>
        <td>{{ nombrePatente(multa.camion_id) }}</td>
        <td>{{ nombreChofer(multa.chofer_id) }}</td>
        <td>{{ multa.motivo }}</td>
        <td>{{ multa.monto ? ('$' + (multa.monto | number)) : '-' }}</td>
        <td>{{ multa.fecha | date:'dd/MM/yyyy' }}</td>
      </tr>
    }
  </app-tabla-paginada>
</div>

@if (modalAbierto()) {
  <app-modal titulo="Nueva multa" (cerrado)="cerrarModal()">
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <label for="camion">Camión</label>
    <select id="camion" [(ngModel)]="nuevaMulta.camion_id">
      <option value="" disabled selected>Elegí un camión</option>
      @for (camion of camiones(); track camion.id) {
        <option [value]="camion.id">{{ camion.patente }}</option>
      }
    </select>

    <label for="chofer">Chofer (opcional)</label>
    <select id="chofer" [(ngModel)]="nuevaMulta.chofer_id">
      <option [value]="undefined">Sin especificar</option>
      @for (chofer of choferes(); track chofer.id) {
        <option [value]="chofer.id">{{ chofer.nombre_completo }}</option>
      }
    </select>

    <label for="motivo">Motivo</label>
    <input id="motivo" type="text" [(ngModel)]="nuevaMulta.motivo" (input)="nuevaMulta.motivo = $event.target.value.toUpperCase()" />

    <label for="monto">Monto</label>
    <input id="monto" type="number" [(ngModel)]="nuevaMulta.monto" />

    <label for="fecha">Fecha (si no se completa, usa hoy)</label>
    <input id="fecha" type="date" [(ngModel)]="nuevaMulta.fecha" />

    <div class="acciones-modal">
      <button (click)="cerrarModal()">Cancelar</button>
      <button class="btn-primario" (click)="confirmarAlta()">Registrar</button>
    </div>
  </app-modal>
}
